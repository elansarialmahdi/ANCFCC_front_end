<div class="container">
  <div class="header">
    <div class="logo-section">
      <img src="./assets/ancfcc-logo.png" alt="ANCFCC Logo" class="logo">
    </div>
  </div>

  <div class="login-container">
    <div class="login-form">
<h2 class="login-title">Se connecter</h2>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="cin">CIN</label>
        <input type="text" id="cin" [(ngModel)]="cin" name="cin" placeholder="Entrez votre CIN" required />
      </div>
      <div class="form-group">
        <label for="phone">Numéro de téléphone</label>
        <div class="phone-input-container">
          <select class="area-code-input" [(ngModel)]="areaCode" name="areaCode" required>
            <option value="+1">+1 (USA, Canada)</option>
<option value="+20">+20 (Egypt)</option>
<option value="+212">+212 (Morocco)</option>
<option value="+213">+213 (Algeria)</option>
<option value="+216">+216 (Tunisia)</option>
<option value="+218">+218 (Libya)</option>
<option value="+27">+27 (South Africa)</option>
<option value="+30">+30 (Greece)</option>
<option value="+31">+31 (Netherlands)</option>
<option value="+32">+32 (Belgium)</option>
<option value="+33">+33 (France)</option>
<option value="+34">+34 (Spain)</option>
<option value="+39">+39 (Italy)</option>
<option value="+40">+40 (Romania)</option>
<option value="+44">+44 (United Kingdom)</option>
<option value="+45">+45 (Denmark)</option>
<option value="+46">+46 (Sweden)</option>
<option value="+47">+47 (Norway)</option>
<option value="+48">+48 (Poland)</option>
<option value="+49">+49 (Germany)</option>
<option value="+52">+52 (Mexico)</option>
<option value="+55">+55 (Brazil)</option>
<option value="+60">+60 (Malaysia)</option>
<option value="+61">+61 (Australia)</option>
<option value="+62">+62 (Indonesia)</option>
<option value="+63">+63 (Philippines)</option>
<option value="+64">+64 (New Zealand)</option>
<option value="+65">+65 (Singapore)</option>
<option value="+66">+66 (Thailand)</option>
<option value="+81">+81 (Japan)</option>
<option value="+82">+82 (South Korea)</option>
<option value="+84">+84 (Vietnam)</option>
<option value="+86">+86 (China)</option>
<option value="+90">+90 (Turkey)</option>
<option value="+91">+91 (India)</option>
<option value="+92">+92 (Pakistan)</option>
<option value="+93">+93 (Afghanistan)</option>
<option value="+94">+94 (Sri Lanka)</option>
<option value="+98">+98 (Iran)</option>

            <!-- Add more area codes as needed -->
          </select>
          <input type="tel" class="phone-number-input" [(ngModel)]="phoneNumber" name="phoneNumber" placeholder="6XX XXX XXX" required />
          <button type="button" class="verify-btn" (click)="sendVerificationCode()">Vérifier</button>
        </div>
      </div>
      <div class="phone-verification">
  <div class="verification-code-container" *ngIf="showVerification">
    <input
      type="text"
      maxlength="1"
      class="verification-code-input"
      *ngFor="let code of codeInputs; let i = index"
      [(ngModel)]="verificationCode[i]"
      name="code{{i}}"
      (input)="focusNext(i, $event)"
      #codeInput
      required
    />
  </div>
</div>
      <button type="submit" class="login-btn">Se connecter</button>
    </form>
    <div class="signup-link">
      <p>Pas de compte ? <a routerLink="/signup">S'inscrire</a></p>
    </div>
  </div>
</div>
