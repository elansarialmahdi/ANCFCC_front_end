<div class="container">
  <div class="header">
    <div class="logo-section">
      <img src="ancfcc-logo.png" alt="ANCFCC Logo" class="logo">
    </div>
  </div>

  <div class="login-container">
    <div class="login-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10,17 15,12 10,7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
    </div>
    
    <h2 class="login-title">Se connecter</h2>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="cin">CIN</label>
        <input 
          type="text" 
          id="cin" 
          name="cin" 
          [(ngModel)]="formData.cin" 
          required
          placeholder="Entrez votre CIN">
      </div>

      <div class="form-group">
        <label for="numero">Numéro</label>
        <div class="phone-verification">
          <input 
            type="tel" 
            id="numero" 
            name="numero" 
            [(ngModel)]="formData.numero" 
            required
            placeholder="Numéro de téléphone">
          <button type="button" class="verify-btn" (click)="sendVerification()">Vérifier</button>
        </div>
      </div>

      <div class="form-group">
        <label for="verification">Vérification</label>
        <input 
          type="text" 
          id="verification" 
          name="verification" 
          [(ngModel)]="formData.verification" 
          required
          placeholder="Code de vérification">
      </div>

      <button type="submit" class="login-btn" [disabled]="!loginForm.form.valid">
        Suivant
      </button>

      <div class="signup-link">
        <p>Vous n'avez pas de compte? <a href="#" (click)="goToSignup($event)">Créer un compte</a></p>
      </div>
    </form>
  </div>
</div>
